<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>SKYBREAK — Neon Rooftop Roguelite</title>
<style>
:root{color-scheme:dark;--cyan:#68f7ef;--pink:#ff5fa8;--gold:#ffd36b}*{box-sizing:border-box}body{margin:0;background:#080b1d;color:#fff;font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;overflow:hidden;user-select:none;touch-action:none}#shell{height:100dvh;width:100vw;position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% 18%,#242650,#070a19 78%)}canvas{display:block;width:100%;height:100%;touch-action:none}#hud{position:absolute;inset:18px 20px auto;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;z-index:4;gap:12px}.stat{font-size:10px;color:#a7b1d8;letter-spacing:2px;font-weight:800}.big{font-size:29px;font-weight:1000;letter-spacing:-1px;line-height:1.15;text-shadow:0 2px 16px #10152e}.pill{border:1px solid #ffffff24;background:#0c133ac9;border-radius:100px;padding:9px 13px;box-shadow:0 8px 30px #0003;backdrop-filter:blur(10px)}#right{text-align:right;display:grid;gap:7px}.tiny{font-size:12px;color:#c5ceef}#panel{position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(180deg,#080b19ba,#080b19e8);z-index:10;padding:18px;backdrop-filter:blur(5px)}#panel.hidden{display:none}.modal{width:min(530px,100%);background:linear-gradient(145deg,#202549f5,#10142ded);border:1px solid #9ca9ff40;border-radius:25px;box-shadow:0 35px 100px #000b, inset 0 1px #fff2;padding:30px;text-align:center}.logo{font-size:clamp(44px,10vw,76px);line-height:.95;letter-spacing:-5px;font-weight:1000;margin:0;color:#fff;text-shadow:4px 5px #f653aa,8px 10px #32286c}.kicker{color:#71f7ed;letter-spacing:4px;font-size:11px;font-weight:900;margin:20px 0 10px}.desc{color:#bfc7e7;line-height:1.6;font-size:14px;margin:17px auto;max-width:390px}button{cursor:pointer;border:0;color:white;font-weight:900;letter-spacing:1px}button:focus-visible{outline:3px solid var(--cyan)}.primary{padding:16px 28px;background:linear-gradient(120deg,#fb4f9a,#9d5fff);border-radius:14px;box-shadow:0 7px 0 #5b327f,0 15px 30px #fa4d9644;font-size:15px}.primary:active{transform:translateY(4px);box-shadow:0 3px 0 #5b327f}.guide{display:flex;flex-wrap:wrap;justify-content:center;gap:9px;margin:26px auto 20px}.key{background:#ffffff13;border:1px solid #ffffff30;border-radius:8px;font-size:11px;color:#d3def9;padding:7px 9px}.upgrades{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:22px 0}.upgrade{text-align:left;min-height:162px;padding:15px 12px;border:1px solid #ffffff3a;background:#ffffff0c;border-radius:15px;transition:transform .15s,background .15s}.upgrade:hover{transform:translateY(-5px);background:#4a467877;border-color:#8df7ff}.upgrade .emoji{display:block;font-size:28px;margin-bottom:14px}.upgrade strong{display:block;color:#fff;font-size:14px;letter-spacing:0}.upgrade small{display:block;color:#adb9e2;margin-top:7px;font-weight:500;letter-spacing:0;line-height:1.45}.line{height:1px;background:#ffffff22;margin:18px 0}.sub{color:#aab7e0;font-size:12px}#pauseBtn,#muteBtn{pointer-events:auto;cursor:pointer;background:#11183ac9;color:#d9e5ff;border:1px solid #ffffff2d;border-radius:12px;padding:9px 11px;font-size:14px}#mobile{position:absolute;inset:auto 15px 20px;display:none;justify-content:space-between;align-items:end;z-index:6;pointer-events:none}#mobile .cluster{display:flex;gap:9px}.touch{pointer-events:auto;display:grid;place-items:center;width:65px;height:65px;border-radius:18px;border:1px solid #cbd8ff61;background:#24305ab8;color:#fff;font-size:25px;font-weight:900;touch-action:none;backdrop-filter:blur(8px)}.touch.action{background:#9a307cc9}.touch.dash{background:#247e92c9}.hidden{display:none!important}#toast{position:absolute;top:92px;left:50%;transform:translateX(-50%);white-space:nowrap;color:#fefefe;background:#222b53dc;border:1px solid #ffffff2c;border-radius:100px;padding:9px 15px;font-size:12px;font-weight:800;z-index:8;opacity:0;transition:opacity .2s;pointer-events:none}@media(max-width:700px){#hud{inset:12px 12px auto}.big{font-size:23px}.modal{padding:21px}.upgrades{gap:6px}.upgrade{padding:10px 8px;min-height:175px}.upgrade strong{font-size:12px}.upgrade small{font-size:10px}#mobile{display:flex}}@media(pointer:coarse){#mobile{display:flex}}
</style></head><body><div id="shell"><canvas id="game"></canvas><div id="hud"><div><div class="stat">ALTITUDE</div><div class="big" id="alt">0 m</div><div class="tiny" id="best"></div></div><div id="right"><div class="pill"><span style="color:#ffd36b">◆</span> <strong id="gems">0</strong> &nbsp; <span style="color:#ff75ac">♥</span> <strong id="hp">3</strong></div><div><button id="muteBtn" title="Toggle audio">♫</button> <button id="pauseBtn" title="Pause">Ⅱ</button></div><div class="tiny" id="power">DASH READY</div></div></div><div id="toast"></div><div id="mobile"><div class="cluster"><button class="touch" data-key="left">◀</button><button class="touch" data-key="right">▶</button></div><div class="cluster"><button class="touch dash" data-key="dash">↯</button><button class="touch action" data-key="jump">↑</button></div></div><div id="panel"><div class="modal" id="modal"></div></div></div>
<script>
(()=>{'use strict';
const canvas=document.getElementById('game'), ctx=canvas.getContext('2d'), shell=document.getElementById('shell');
const panel=document.getElementById('panel'),modal=document.getElementById('modal'),ui={alt:document.getElementById('alt'),gems:document.getElementById('gems'),hp:document.getElementById('hp'),best:document.getElementById('best'),power:document.getElementById('power')};
let W=900,H=650,DPR=1,scale=1,viewW=900,viewH=650,cam=0,game=null,last=0,elapsed=0,paused=false,mode='menu',audioOn=true,audioCtx=null,particles=[],shake=0,toastUntil=0,stars=[];
const keys={left:false,right:false,jump:false,dash:false},press={jump:false,dash:false};let seed=1;
const rnd=()=>{seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296};const rr=(a,b)=>a+rnd()*(b-a);const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const bestKey='skybreak_best_v1';let best=0;try{best=+localStorage.getItem(bestKey)||0}catch(e){}
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=shell.clientWidth;H=shell.clientHeight;canvas.width=Math.floor(W*DPR);canvas.height=Math.floor(H*DPR);scale=Math.min(W/680,H/680);viewW=W/scale;viewH=H/scale;stars=Array.from({length:85},()=>({x:Math.random()*viewW,y:Math.random()*viewH,r:Math.random()*1.8+.3,s:Math.random()*.6+.2}));}window.addEventListener('resize',resize);resize();
function sound(freq=500,dur=.12,type='sine',vol=.07,slide=0){if(!audioOn)return;try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();const t=audioCtx.currentTime,o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.setValueAtTime(freq,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(40,freq+slide),t+dur);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(audioCtx.destination);o.start(t);o.stop(t+dur+.01)}catch(e){}}
function toast(s){const el=document.getElementById('toast');el.textContent=s;el.style.opacity=1;toastUntil=performance.now()+1800;}
function burst(x,y,color,n=14,power=180){for(let i=0;i<n;i++){const a=rr(0,Math.PI*2),s=rr(25,power);particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rr(.2,.8),max:.8,c:color,r:rr(2,5)})}}
function htmlMenu(){mode='menu';panel.classList.remove('hidden');modal.innerHTML='<div class="kicker">ONE MORE RUN?</div><h1 class="logo">SKY<br>BREAK</h1><p class="desc">A rooftop escape roguelite. Leap between floating platforms, chain air-dashes, grab neon shards and outrun the rising void. Every run builds a different tower.</p><button class="primary" id="start">START RUN →</button><div class="guide"><span class="key">← → / A D MOVE</span><span class="key">SPACE / ↑ JUMP</span><span class="key">SHIFT DASH</span></div><div class="sub">Double-jump • Upgrade every 8 shards • Survive as high as you can<br>Personal best: '+best+' m</div>';document.getElementById('start').onclick=start;}
function start(){seed=(Date.now()>>>0)||123;const p={x:0,y:0,w:28,h:34,vx:0,vy:0,dir:1,jumps:0,jumpMax:2,dashTime:0,dashCD:0,dashMax:.9,inv:0,hp:3,maxHp:3,speed:250,jump:475,magnet:58,shield:0,trail:[],dashKills:0};game={p,platforms:[],crystals:[],enemies:[],height:0,highest:0,loot:0,nextUp:8,upLevel:0,deathY:720,baseY:520,combo:0,comboT:0,time:0};cam=380;particles=[];elapsed=0;shake=0;paused=false;mode='play';for(let i=0;i<2;i++)game.platforms.push({x:i===0?-110:145,y:520,w:i===0?220:90,h:20,kind:'solid'});p.x=-10;p.y=486;game.height=440;generateTo(-1100);panel.classList.add('hidden');toast('CLIMB! THE VOID IS RISING');sound(320,.2,'sawtooth',.05,240)}
function generateTo(target){const g=game;while(g.height>target){let prev=g.platforms[g.platforms.length-1],gap=rr(85,132);let ny=g.height-gap;const maxStep=145;let px=clamp(prev.x+rr(-maxStep,maxStep),-viewW*.39,viewW*.39-100),width=rr(95,155);if(g.platforms.length%6===0)width=rr(140,190);const kind=g.platforms.length>6&&rnd()<.17?'crumble':rnd()<.13?'bounce':'solid';g.platforms.push({x:px,y:ny,w:width,h:16,kind,age:0,broken:false});g.crystals.push({x:px+width/2,y:ny-36,r:10,got:false,bob:rr(0,6)});if(rnd()<.38)g.crystals.push({x:px+width/2+rr(-35,35),y:ny-75,r:9,got:false,bob:rr(0,6)});if(g.platforms.length>8&&rnd()<.33)g.enemies.push({x:px+width/2,y:ny-52,base:px+width/2,range:rr(38,86),phase:rr(0,6),r:15,dead:false});g.height=ny}}
function chooseUpgrade(){mode='upgrade';panel.classList.remove('hidden');const choices=[{icon:'⚡',name:'Dash Reactor',desc:'Dash recharges 25% faster.',fn:()=>game.p.dashMax=Math.max(.26,game.p.dashMax*.75)},{icon:'🦘',name:'Rocket Boots',desc:'Jump 10% higher.',fn:()=>game.p.jump*=1.1},{icon:'🧲',name:'Shard Magnet',desc:'Collect loot from farther away.',fn:()=>game.p.magnet+=48},{icon:'❤️',name:'Emergency Heart',desc:'Restore 2 health; increase max HP by 1.',fn:()=>{game.p.maxHp++;game.p.hp=Math.min(game.p.maxHp,game.p.hp+2)}},{icon:'💨',name:'Hyper Sprint',desc:'Move 13% faster.',fn:()=>game.p.speed*=1.13},{icon:'🛡️',name:'Bubble Shield',desc:'Block the next collision.',fn:()=>game.p.shield++},{icon:'✨',name:'Triple Jump',desc:'Gain one extra air jump.',fn:()=>game.p.jumpMax++},{icon:'☄️',name:'Nova Dash',desc:'Dash lasts longer and breaks drones.',fn:()=>game.p.dashMax*=.9}];let chosen=[];while(chosen.length<3){let i=Math.floor(rnd()*choices.length);if(!chosen.includes(i))chosen.push(i)}modal.innerHTML='<div class="kicker">LEVEL '+(++game.upLevel)+' • POWER UP</div><h2 style="font-size:31px;margin:7px 0">CHOOSE YOUR EDGE</h2><p class="desc">The tower gets meaner. You get stronger.</p><div class="upgrades">'+chosen.map((v,i)=>'<button class="upgrade" data-up="'+i+'"><span class="emoji">'+choices[v].icon+'</span><strong>'+choices[v].name+'</strong><small>'+choices[v].desc+'</small></button>').join('')+'</div><div class="sub">Select one upgrade to resume your run</div>';modal.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>{choices[chosen[+b.dataset.up]].fn();mode='play';panel.classList.add('hidden');sound(570,.2,'triangle',.07,450);toast('UPGRADE EQUIPPED')})}
function die(){if(mode!=='play')return;mode='dead';sound(180,.5,'sawtooth',.1,-130);let score=Math.max(0,Math.floor(game.highest/10));if(score>best){best=score;try{localStorage.setItem(bestKey,best)}catch(e){}}panel.classList.remove('hidden');modal.innerHTML='<div class="kicker">'+(score>=best?'NEW HEIGHT REACHED':'THE VOID CAUGHT YOU')+'</div><h2 class="logo" style="font-size:56px">GAME<br>OVER</h2><div style="display:flex;justify-content:center;gap:35px;margin:30px 0"><div><div class="stat">ALTITUDE</div><div class="big">'+score+' m</div></div><div><div class="stat">SHARDS</div><div class="big">'+game.loot+'</div></div><div><div class="stat">BEST</div><div class="big">'+best+' m</div></div></div><button class="primary" id="again">RUN IT BACK ↗</button><p class="desc">New tower. New upgrades. Better run.</p>';document.getElementById('again').onclick=start}
function damage(){const p=game.p;if(p.inv>0)return;if(p.shield>0){p.shield--;p.inv=.65;toast('SHIELD BLOCKED!');sound(480,.15,'triangle',.1,-270);return}p.hp--;p.inv=1.3;shake=12;burst(p.x,p.y,'#ff689f',22);sound(145,.3,'sawtooth',.12,-90);p.vy=-300;p.vx=-p.dir*180;if(p.hp<=0)die()}
function keydown(e,state){let k=e.key.toLowerCase(),name=null;if(k==='arrowleft'||k==='a')name='left';if(k==='arrowright'||k==='d')name='right';if(k===' '||k==='arrowup'||k==='w')name='jump';if(k==='shift'||k==='x'||k==='k')name='dash';if(name){e.preventDefault();if(state&&!keys[name])press[name]=true;keys[name]=state}if(state&&k==='p')togglePause();if(state&&k==='enter'&&(mode==='menu'||mode==='dead'))start()};window.addEventListener('keydown',e=>keydown(e,true));window.addEventListener('keyup',e=>keydown(e,false));window.addEventListener('blur',()=>{Object.keys(keys).forEach(k=>keys[k]=false);if(mode==='play')togglePause()});document.querySelectorAll('[data-key]').forEach(b=>{let k=b.dataset.key;b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);if(!keys[k])press[k]=true;keys[k]=true});const up=e=>{e.preventDefault();keys[k]=false};b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);b.addEventListener('lostpointercapture',()=>keys[k]=false)});document.getElementById('pauseBtn').onclick=togglePause;document.getElementById('muteBtn').onclick=()=>{audioOn=!audioOn;document.getElementById('muteBtn').textContent=audioOn?'♫':'♪̸'};
function togglePause(){if(mode==='play'){mode='pause';panel.classList.remove('hidden');modal.innerHTML='<div class="kicker">TAKE A BREATHER</div><h2 style="font-size:45px">PAUSED</h2><p class="desc">The void can wait. Briefly.</p><button class="primary" id="resume">RESUME →</button><div class="line"></div><button class="key" id="retry">RESTART RUN</button>';document.getElementById('resume').onclick=()=>{mode='play';panel.classList.add('hidden')};document.getElementById('retry').onclick=start}else if(mode==='pause'){mode='play';panel.classList.add('hidden')}}
function update(dt){if(mode!=='play'||!game)return;const g=game,p=g.p;g.time+=dt;elapsed+=dt;p.inv=Math.max(0,p.inv-dt);p.dashCD=Math.max(0,p.dashCD-dt);g.comboT-=dt;if(g.comboT<0)g.combo=0;let move=(keys.right?1:0)-(keys.left?1:0);if(move)p.dir=move;
if(press.jump&&p.jumps<p.jumpMax){p.vy=-p.jump*(p.jumps===0?1:.92);p.jumps++;sound(260+p.jumps*90,.12,'triangle',.075,250);burst(p.x,p.y+15,'#6cf8f3',9,90)}press.jump=false;
if(press.dash&&p.dashCD<=0){p.dashTime=.16;p.dashCD=p.dashMax;p.vx=p.dir*780;p.vy=0;shake=4;sound(700,.14,'sawtooth',.05,-480);burst(p.x,p.y,'#c273ff',15,170)}press.dash=false;
const oldBottom=p.y+p.h/2;if(p.dashTime>0){p.dashTime-=dt;p.vx=p.dir*780;p.vy=0;p.trail.push({x:p.x,y:p.y,life:.3})}else{p.vx=move*p.speed;p.vy=clamp(p.vy+1180*dt,-900,810)}p.x+=p.vx*dt;p.y+=p.vy*dt;let bound=viewW*.48;p.x=clamp(p.x,-bound,bound);if(p.x===-bound||p.x===bound)p.vx=0;
for(const plat of g.platforms){if(plat.broken)continue;if(p.vy>=0&&oldBottom<=plat.y+8&&p.y+p.h/2>=plat.y&&p.x+p.w/2>plat.x&&p.x-p.w/2<plat.x+plat.w){p.y=plat.y-p.h/2;p.vy=plat.kind==='bounce'?-p.jump*1.3:0;p.jumps=plat.kind==='bounce'?1:0;if(plat.kind==='bounce'){sound(570,.16,'sine',.065,400);burst(p.x,plat.y,'#5bffca',9)}if(plat.kind==='crumble'&&!plat.age){plat.age=.32;sound(120,.08,'square',.03)}}if(plat.age>0){plat.age-=dt;if(plat.age<=0){plat.broken=true;burst(plat.x+plat.w/2,plat.y,'#e79a6f',19)}}}
for(const c of g.crystals){if(c.got)continue;const dx=c.x-p.x,dy=c.y-p.y,dist=Math.hypot(dx,dy);if(dist<p.magnet&&dist>15){c.x-=dx*dt*clamp(250/dist,0,8);c.y-=dy*dt*clamp(250/dist,0,8)}if(dist<26){c.got=true;g.loot++;g.combo++;g.comboT=3;burst(c.x,c.y,'#ffd66a',12,125);sound(650+(g.combo%7)*75,.09,'sine',.055,180);if(g.loot>=g.nextUp){g.nextUp+=8;chooseUpgrade();break}}}
for(const e of g.enemies){if(e.dead)continue;e.x=e.base+Math.sin(g.time*1.6+e.phase)*e.range;if(Math.abs(e.x-p.x)<e.r+p.w/2-2&&Math.abs(e.y-p.y)<e.r+p.h/2-2){if(p.dashTime>0){e.dead=true;g.loot+=2;burst(e.x,e.y,'#ff6ba7',22);sound(380,.22,'square',.06,400)}else damage()}}
const altitude=Math.max(0,520-p.y);g.highest=Math.max(g.highest,altitude);let targetCam=Math.min(cam,p.y+viewH*.1);cam+=(targetCam-cam)*Math.min(1,dt*4);generateTo(cam-300);g.deathY-=dt*(27+Math.min(90,g.highest/75));g.deathY=Math.min(g.deathY,cam+viewH*.78);if(p.y-p.h/2>g.deathY)die();g.platforms=g.platforms.filter(t=>t.y<g.deathY+150);g.crystals=g.crystals.filter(c=>!c.got&&c.y<g.deathY+140);g.enemies=g.enemies.filter(e=>!e.dead&&e.y<g.deathY+140);p.trail.forEach(t=>t.life-=dt);p.trail=p.trail.filter(t=>t.life>0);ui.alt.textContent=Math.floor(g.highest/10)+' m';ui.gems.textContent=g.loot;ui.hp.textContent=p.hp+(p.shield?' 🛡'+p.shield:'');ui.best.textContent='BEST '+best+' m';ui.power.textContent=p.dashCD===0?'↯ DASH READY':'↯ '+p.dashCD.toFixed(1)+'s';}
function draw(){ctx.setTransform(DPR,0,0,DPR,0,0);ctx.clearRect(0,0,W,H);ctx.fillStyle='#090c21';ctx.fillRect(0,0,W,H);ctx.save();ctx.translate(W/2,H/2);ctx.scale(scale,scale);const vw=viewW,vh=viewH,t=performance.now()/1000;let grd=ctx.createLinearGradient(0,-vh/2,0,vh/2);grd.addColorStop(0,'#181a43');grd.addColorStop(.7,'#0d122e');grd.addColorStop(1,'#090b1e');ctx.fillStyle=grd;ctx.fillRect(-vw/2,-vh/2,vw,vh);
for(const s of stars){let y=((s.y+cam*s.s*.2)%vh+vh)%vh-vh/2;ctx.globalAlpha=.3+s.s*.6;ctx.fillStyle='#bbc6ff';ctx.fillRect(s.x-vw/2,y,s.r,s.r)}ctx.globalAlpha=1;
for(let layer=0;layer<3;layer++){let width=100+layer*43,shift=((cam*(.08+layer*.08))%220+220)%220;ctx.fillStyle=['#16183a','#131938','#10162e'][layer];for(let i=-8;i<8;i++){let bx=i*width+((layer*73)%70)-vw/2,by=vh/2-180+shift;let top=by-(85+((i*71+layer*29+999)%160));ctx.fillRect(bx,top,width-3,vh);ctx.fillStyle=layer===0?'#343b72':'#28315a';for(let wy=top+15;wy<vh/2;wy+=22)for(let wx=bx+11;wx<bx+width-8;wx+=18){if((Math.abs(Math.floor(wx*11+wy*3))%4)===0)ctx.fillRect(wx,wy,4,7)}ctx.fillStyle=['#16183a','#131938','#10162e'][layer]}}
if(game){ctx.save();ctx.translate(0,-cam-vh*.0);const g=game,p=g.p;
